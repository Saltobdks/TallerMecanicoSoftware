services:
  mysql:
    image: mysql:8.4
    container_name: taller-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taller
      MYSQL_USER: taller_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cambia-esta-clave}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambia-root-clave}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
